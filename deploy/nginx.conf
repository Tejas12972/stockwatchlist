# nginx site config for a single-host deployment.
#
# Install to /etc/nginx/sites-available/options-analytics and symlink into
# sites-enabled. Run `certbot --nginx -d options.example.com` afterwards; it
# rewrites the TLS lines below in place.

upstream options_api {
    server 127.0.0.1:8000;
}

upstream options_web {
    server 127.0.0.1:3000;
}

# The unofficial upstream data source rate-limits, and every /api request can
# become a vendor request. Throttling here keeps an over-eager browser tab from
# getting the whole host throttled by Yahoo.
limit_req_zone $binary_remote_addr zone=options_api:10m rate=10r/s;

server {
    listen 80;
    server_name options.example.com;

    # Certbot needs this to stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name options.example.com;

    ssl_certificate     /etc/letsencrypt/live/options.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/options.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # This is a single-user analytics tool with no authentication. It should not
    # be indexed, and it holds no data worth exposing to a crawler.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/options-analytics.access.log;
    error_log  /var/log/nginx/options-analytics.error.log;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=options_api burst=20 nodelay;

        proxy_pass http://options_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold chain request can take a while when the vendor is slow, and a
        # 60s default cuts it off mid-fetch with a confusing gateway error.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location / {
        proxy_pass http://options_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
