name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The front end lands in M5. Until then there is no web/package.json to
  # install, so the web job gates on its existence rather than failing the run
  # for a milestone that has not started. It switches itself on automatically.
  detect:
    name: detect workspaces
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/package.json not present yet; skipping the web job"
          fi

  api:
    name: api (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy options_tool

      # The suite runs with --disable-socket, so this is already offline. The
      # coverage gate is scoped to the analytics package: that is where a
      # regression would silently produce wrong numbers rather than an error.
      - name: Test
        run: >-
          pytest
          --cov=options_tool
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - name: Analytics coverage gate
        run: >-
          pytest
          --cov=options_tool/analytics
          --cov-report=term
          --cov-fail-under=90
          -q

      - name: Verify the database migration applies and reverses
        env:
          OPTIONS_DATABASE_URL: sqlite:///./ci-migration-check.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify the CLI runs offline against the checked-in fixture
        env:
          OPTIONS_PROVIDER: fixture
          OPTIONS_DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -m options_tool --provider fixture chain AAPL --expiry 2027-01-15 --near-the-money 3
          python -m options_tool --provider fixture watchlist --add AAPL
          python -m options_tool --provider fixture snapshot AAPL
          python -m options_tool --provider fixture snapshot AAPL | tee second-run.txt
          grep -q "refreshed" second-run.txt
          python -m options_tool --provider fixture ivrank AAPL | tee rank.txt
          grep -q "insufficient history" rank.txt

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: api/coverage.xml
          if-no-files-found: error

  web:
    name: web
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git and must not be"
            exit 1
          fi
          echo "no tracked .env"
